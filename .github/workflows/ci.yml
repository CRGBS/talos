name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run talos-mod tests
        run: ./gradlew :talos-mod:test --no-configuration-cache
      - name: Build remapped Talos JAR
        run: ./gradlew :talos-mod:remapJar --no-configuration-cache
      - name: Upload Talos JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: talos-mod-no-mining-jar
          path: talos-mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
